<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ไม่พบหน้าที่ต้องการ · AUAUSAVE TH</title>
  <link rel="stylesheet" href="/styles.css?v=20261123-profile-schedules">
  <script src="/public-routes.js?v=20261110-clean-urls"></script>
  <script>
    if (PublicRoutes.resolve({ pathname: location.pathname, hash: '' })) {
      const entry = new URL('/', location.origin);
      entry.search = location.search;
      entry.hash = location.hash;
      entry.searchParams.set('__route', location.pathname);
      location.replace(entry.href);
    }
  </script>
</head>
<body><main class="container"><section class="section"><h1>ไม่พบหน้าที่ต้องการ</h1><p>โปรดตรวจสอบลิงก์อีกครั้ง</p><a class="btn" href="/">กลับหน้าแรก</a></section></main></body>
</html>
