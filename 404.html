<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>กำลังเปิด AUAUSAVE HOUSE</title>
  <script>
    (function () {
      var cleanRouteMap = {
        "/auausave": "/#/AUAUSAVE",
        "/auautnp": "/#/AUAU",
        "/savewrg": "/#/SAVE",
        "/projects": "/#/projects"
      };
      var pathname = window.location.pathname.replace(/\/+$/, "").toLowerCase();
      var targetRoute = cleanRouteMap[pathname];

      if (targetRoute && !window.location.hash) {
        window.location.replace(targetRoute + window.location.search);
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>ไม่พบหน้าที่ต้องการ</h1>
    <p><a href="/">กลับหน้าแรก AUAUSAVE HOUSE</a></p>
  </main>
</body>
</html>
